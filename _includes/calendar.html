<!-- Interactive Calendar Component -->
<div class="calendar-component">
  <div class="calendar-header">
    <button id="prev-month" class="btn btn-secondary">&lt;</button>
    <h3 id="current-month-year"></h3>
    <button id="next-month" class="btn btn-secondary">&gt;</button>
  </div>

  <div class="calendar-grid">
    <div class="day-name">Sun</div>
    <div class="day-name">Mon</div>
    <div class="day-name">Tue</div>
    <div class="day-name">Wed</div>
    <div class="day-name">Thu</div>
    <div class="day-name">Fri</div>
    <div class="day-name">Sat</div>
  </div>

  <div id="calendar-days" class="calendar-grid days-grid"></div>
</div>

<script>
  const events = [
    {% for event in site.data.events %}
    {
      date: "{{ event.date }}",
      name: "{{ event.name | escape }}",
      location: "{{ event.location | escape }}",
      start_time: "{{ event.start_time }}",
      end_time: "{{ event.end_time }}",
      all_day: {{ event.all_day | default: false }},
      registration_link: "{{ event.registration_link }}",
      description: "{{ event.description | escape }}",
      image: "{{ event.image }}"
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  document.addEventListener("DOMContentLoaded", function () {
    const monthYearLabel = document.getElementById("current-month-year");
    const daysContainer = document.getElementById("calendar-days");
    const prevBtn = document.getElementById("prev-month");
    const nextBtn = document.getElementById("next-month");

    let currentDate = new Date();

    function sortEvents(events) {
      return events.sort((a, b) => {

        // All-day events appear first
        if (a.all_day && !b.all_day) return -1;
        if (!a.all_day && b.all_day) return 1;

        // Sort timed events by start time
        return (a.start_time || "99:99")
          .localeCompare(b.start_time || "99:99");
      });
    }

    function renderCalendar() {
      daysContainer.innerHTML = "";

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      monthYearLabel.textContent = new Date(year, month).toLocaleDateString(
        "en-US",
        {
          month: "long",
          year: "numeric"
        }
      );

      const firstDayIndex = new Date(year, month, 1).getDay();
      const lastDay = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement("div");
        emptyCell.classList.add("day-cell", "empty");
        daysContainer.appendChild(emptyCell);
      }

      for (let day = 1; day <= lastDay; day++) {
        const cell = document.createElement("div");
        cell.classList.add("day-cell");

        const formattedDate =
          `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;

        cell.innerHTML = `
          <span class="day-number">${day}</span>
        `;

        const dayEvents = sortEvents(
          events.filter(event => event.date === formattedDate)
        );

        // Only show first 3 events
        dayEvents.slice(0, 3).forEach(event => {
          const badge = document.createElement("a");

          badge.classList.add("event-badge");
          badge.textContent = event.name;

          if (event.registration_link) {
            badge.href = event.registration_link;
            badge.target = "_blank";
          } else {
            badge.href = "#";
          }

          cell.appendChild(badge);
        });

        // Show indicator if there are more events
        if (dayEvents.length > 3) {
          const more = document.createElement("div");
          more.classList.add("event-more");
          more.textContent = "...";
          cell.appendChild(more);
        }

        daysContainer.appendChild(cell);
      }
    }

    prevBtn.addEventListener("click", () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    nextBtn.addEventListener("click", () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    renderCalendar();
  });
</script>
