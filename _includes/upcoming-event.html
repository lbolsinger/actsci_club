{% if include.instagram_url %}
<div class="instagram-image-only-wrapper">
  <div class="instagram-crop-container">
    <blockquote 
      class="instagram-media" 
      data-instgrm-permalink="{{ include.instagram_url }}" 
      data-instgrm-version="14">
    </blockquote>
  </div>
</div>

<script async src="//www.instagram.com/embed.js"></script>
<script>
  if (window.instgrm) {
    window.instgrm.Embeds.process();
  }
</script>
{% endif %}
